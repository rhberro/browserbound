<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrowserBound</title>
    <link rel="stylesheet" href="./src/styles/app.css" />
    <style>
      body {
        overflow: hidden;
        background: #07080c;
        color: #e6f6ff;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
      }
      /* The HUD is a full-viewport overlay above the canvas. It is inert by
         default; only the deck and pill inside it opt back into pointer events. */
      #hud {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="hud"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
